<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invalid Ticket Link</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .card {
        width: min(560px, 100%);
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        padding: 24px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.3rem;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
      .actions {
        margin-top: 18px;
      }
      a {
        display: inline-block;
        text-decoration: none;
        background: #166534;
        color: #fff;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
      }
      a:hover {
        background: #14532d;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main" aria-live="polite">
      <h1>Invalid or Expired Ticket Link</h1>
      <p id="reason">This ticket link is invalid or has expired.</p>
      <div class="actions">
        <a href="/">Back to Home</a>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search)
      const reason = params.get('reason')
      if (reason) {
        document.getElementById('reason').textContent = reason
      }
    </script>
  </body>
</html>
